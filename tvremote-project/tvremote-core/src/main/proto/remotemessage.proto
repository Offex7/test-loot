// Wire-compatible schema based on the public Android TV Remote v2 protocol.
// The key enum follows the Android framework keycode numbering.
// Reference: tronikos/androidtvremote2 (Apache-2.0).
syntax = "proto3";
package remote;
option java_package = "com.radiotv.tvremote.core.proto";
option java_outer_classname = "RemoteProto";
option optimize_for = LITE_RUNTIME;

message RemoteAppLinkLaunchRequest { string app_link = 1; }
message RemoteResetPreferredAudioDevice {}
message RemoteSetPreferredAudioDevice {}
message RemoteAdjustVolumeLevel {}
message RemoteSetVolumeLevel {
  uint32 unknown1 = 1;
  uint32 unknown2 = 2;
  string player_model = 3;
  uint32 unknown4 = 4;
  uint32 unknown5 = 5;
  uint32 volume_max = 6;
  uint32 volume_level = 7;
  bool volume_muted = 8;
}
message RemoteStart { bool started = 1; }
message RemoteVoiceEnd { int32 session_id = 1; }
message RemoteVoicePayload { int32 session_id = 1; bytes samples = 2; }
message RemoteVoiceBegin { int32 session_id = 1; string package_name = 2; }
message RemoteTextFieldStatus {
  int32 counter_field = 1;
  string value = 2;
  int32 start = 3;
  int32 end = 4;
  int32 int5 = 5;
  string label = 6;
}
message RemoteImeShowRequest { RemoteTextFieldStatus remote_text_field_status = 2; }
message RemoteEditInfo { int32 insert = 1; RemoteImeObject text_field_status = 2; }
message RemoteImeObject { int32 start = 1; int32 end = 2; string value = 3; }
message RemoteImeBatchEdit {
  int32 ime_counter = 1;
  int32 field_counter = 2;
  repeated RemoteEditInfo edit_info = 3;
}
message RemoteAppInfo {
  int32 counter = 1;
  int32 int2 = 2;
  int32 int3 = 3;
  string int4 = 4;
  int32 int7 = 7;
  int32 int8 = 8;
  string label = 10;
  string app_package = 12;
  int32 int13 = 13;
}
message RemoteImeKeyInject {
  RemoteAppInfo app_info = 1;
  RemoteTextFieldStatus text_field_status = 2;
}
enum RemoteKeyCode {
  KEYCODE_UNKNOWN = 0;
  KEYCODE_HOME = 3;
  KEYCODE_BACK = 4;
  KEYCODE_0 = 7;
  KEYCODE_1 = 8;
  KEYCODE_2 = 9;
  KEYCODE_3 = 10;
  KEYCODE_4 = 11;
  KEYCODE_5 = 12;
  KEYCODE_6 = 13;
  KEYCODE_7 = 14;
  KEYCODE_8 = 15;
  KEYCODE_9 = 16;
  KEYCODE_DPAD_UP = 19;
  KEYCODE_DPAD_DOWN = 20;
  KEYCODE_DPAD_LEFT = 21;
  KEYCODE_DPAD_RIGHT = 22;
  KEYCODE_DPAD_CENTER = 23;
  KEYCODE_VOLUME_UP = 24;
  KEYCODE_VOLUME_DOWN = 25;
  KEYCODE_POWER = 26;
  KEYCODE_ENTER = 66;
  KEYCODE_DEL = 67;
  KEYCODE_MENU = 82;
  KEYCODE_SEARCH = 84;
  KEYCODE_MEDIA_PLAY_PAUSE = 85;
  KEYCODE_MEDIA_STOP = 86;
  KEYCODE_MEDIA_NEXT = 87;
  KEYCODE_MEDIA_PREVIOUS = 88;
  KEYCODE_MEDIA_REWIND = 89;
  KEYCODE_MEDIA_FAST_FORWARD = 90;
  KEYCODE_MUTE = 91;
  KEYCODE_VOLUME_MUTE = 164;
  KEYCODE_CHANNEL_UP = 166;
  KEYCODE_CHANNEL_DOWN = 167;
  KEYCODE_TV = 170;
  KEYCODE_GUIDE = 172;
  KEYCODE_SETTINGS = 176;
  KEYCODE_TV_INPUT = 178;
  KEYCODE_PROG_RED = 183;
  KEYCODE_PROG_GREEN = 184;
  KEYCODE_PROG_YELLOW = 185;
  KEYCODE_PROG_BLUE = 186;
  KEYCODE_ASSIST = 219;
}
enum RemoteDirection {
  UNKNOWN_DIRECTION = 0;
  START_LONG = 1;
  END_LONG = 2;
  SHORT = 3;
}
message RemoteKeyInject { RemoteKeyCode key_code = 1; RemoteDirection direction = 2; }
message RemotePingResponse { int32 val1 = 1; }
message RemotePingRequest { int32 val1 = 1; int32 val2 = 2; }
message RemoteSetActive { int32 active = 1; }
message RemoteDeviceInfo {
  string model = 1; string vendor = 2; int32 unknown1 = 3; string unknown2 = 4;
  string package_name = 5; string app_version = 6;
}
message RemoteConfigure { int32 code1 = 1; RemoteDeviceInfo device_info = 2; }
message RemoteError { bool value = 1; RemoteMessage message = 2; }
message RemoteMessage {
  RemoteConfigure remote_configure = 1;
  RemoteSetActive remote_set_active = 2;
  RemoteError remote_error = 3;
  RemotePingRequest remote_ping_request = 8;
  RemotePingResponse remote_ping_response = 9;
  RemoteKeyInject remote_key_inject = 10;
  RemoteImeKeyInject remote_ime_key_inject = 20;
  RemoteImeBatchEdit remote_ime_batch_edit = 21;
  RemoteImeShowRequest remote_ime_show_request = 22;
  RemoteVoiceBegin remote_voice_begin = 30;
  RemoteVoicePayload remote_voice_payload = 31;
  RemoteVoiceEnd remote_voice_end = 32;
  RemoteStart remote_start = 40;
  RemoteSetVolumeLevel remote_set_volume_level = 50;
  RemoteAdjustVolumeLevel remote_adjust_volume_level = 51;
  RemoteSetPreferredAudioDevice remote_set_preferred_audio_device = 60;
  RemoteResetPreferredAudioDevice remote_reset_preferred_audio_device = 61;
  RemoteAppLinkLaunchRequest remote_app_link_launch_request = 90;
}
