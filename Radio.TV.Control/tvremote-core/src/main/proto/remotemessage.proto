// Android TV Remote v2 control-message subset. Field numbers follow the publicly documented RemoteMessage protocol.
syntax = "proto3";
package remote;
option java_package = "com.radiotv.control.core.proto";
option java_outer_classname = "RemoteMessageProto";
option optimize_for = LITE_RUNTIME;

message RemoteMessage {
  RemoteConfigure remote_configure = 1;
  RemoteSetActive remote_set_active = 2;
  RemoteError remote_error = 3;
  RemotePingRequest remote_ping_request = 8;
  RemotePingResponse remote_ping_response = 9;
  RemoteKeyInject remote_key_inject = 10;
  RemoteImeKeyInject remote_ime_key_inject = 20;
  RemoteImeBatchEdit remote_ime_batch_edit = 21;
  RemoteImeShowRequest remote_ime_show_request = 22;
  RemoteVoiceBegin remote_voice_begin = 30;
  RemoteVoicePayload remote_voice_payload = 31;
  RemoteVoiceEnd remote_voice_end = 32;
  RemoteStart remote_start = 40;
}
message RemoteConfigure { int32 code1 = 1; RemoteDeviceInfo device_info = 2; }
message RemoteDeviceInfo {
  string model = 1;
  string vendor = 2;
  int32 unknown1 = 3;
  string unknown2 = 4;
  string package_name = 5;
  string app_version = 6;
}
message RemoteSetActive { int32 active = 1; }
message RemoteStart { bool started = 1; }
message RemoteVoiceEnd { int32 session_id = 1; }
message RemoteVoicePayload { int32 session_id = 1; bytes samples = 2; }
message RemoteVoiceBegin { int32 session_id = 1; string package_name = 2; }
message RemoteTextFieldStatus {
  int32 counter_field = 1;
  string value = 2;
  int32 start = 3;
  int32 end = 4;
  int32 int5 = 5;
  string label = 6;
}
message RemoteImeShowRequest { RemoteTextFieldStatus remote_text_field_status = 2; }
message RemoteEditInfo { int32 insert = 1; RemoteImeObject text_field_status = 2; }
message RemoteImeObject { int32 start = 1; int32 end = 2; string value = 3; }
message RemoteImeBatchEdit { int32 ime_counter = 1; int32 field_counter = 2; repeated RemoteEditInfo edit_info = 3; }
message RemoteAppInfo {
  int32 counter = 1;
  int32 int2 = 2;
  int32 int3 = 3;
  string int4 = 4;
  int32 int7 = 7;
  int32 int8 = 8;
  string label = 10;
  string app_package = 12;
  int32 int13 = 13;
}
message RemoteImeKeyInject { RemoteAppInfo app_info = 1; RemoteTextFieldStatus text_field_status = 2; }
message RemotePingRequest { int32 val1 = 1; int32 val2 = 2; }
message RemotePingResponse { int32 val1 = 1; }
message RemoteError { bool value = 1; RemoteMessage message = 2; }
message RemoteKeyInject { RemoteKeyCode key_code = 1; RemoteDirection direction = 2; }
enum RemoteDirection { UNKNOWN_DIRECTION = 0; START_LONG = 1; END_LONG = 2; SHORT = 3; }
enum RemoteKeyCode {
  KEYCODE_UNKNOWN = 0;
  KEYCODE_HOME = 3;
  KEYCODE_BACK = 4;
  KEYCODE_0 = 7;
  KEYCODE_1 = 8;
  KEYCODE_2 = 9;
  KEYCODE_3 = 10;
  KEYCODE_4 = 11;
  KEYCODE_5 = 12;
  KEYCODE_6 = 13;
  KEYCODE_7 = 14;
  KEYCODE_8 = 15;
  KEYCODE_9 = 16;
  KEYCODE_DPAD_UP = 19;
  KEYCODE_DPAD_DOWN = 20;
  KEYCODE_DPAD_LEFT = 21;
  KEYCODE_DPAD_RIGHT = 22;
  KEYCODE_DPAD_CENTER = 23;
  KEYCODE_VOLUME_UP = 24;
  KEYCODE_VOLUME_DOWN = 25;
  KEYCODE_POWER = 26;
  KEYCODE_MENU = 82;
  KEYCODE_SEARCH = 84;
  KEYCODE_MEDIA_PLAY_PAUSE = 85;
  KEYCODE_MEDIA_STOP = 86;
  KEYCODE_MEDIA_REWIND = 89;
  KEYCODE_MEDIA_FAST_FORWARD = 90;
  KEYCODE_VOLUME_MUTE = 164;
  KEYCODE_CHANNEL_UP = 166;
  KEYCODE_CHANNEL_DOWN = 167;
  KEYCODE_TV_INPUT = 178;
}
