name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Locate APK
        run: |
          set -e
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "Found APK: $APK"
          cp "$APK" unsigned-release.apk
          ls -lh unsigned-release.apk
      - name: Generate test signing key
        run: |
          keytool -genkeypair -v \
            -keystore streamhub-test.keystore \
            -alias streamhub \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=TV Radio Online, OU=Android, O=Offex7, L=, ST=, C=US"
      - name: Sign APK
        run: |
          set -e
          apksigner sign \
            --ks streamhub-test.keystore \
            --ks-key-alias streamhub \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out tv-radio-online.apk \
            unsigned-release.apk
          apksigner verify --verbose --print-certs tv-radio-online.apk
          ls -lh tv-radio-online.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Radio-Online-APK
          path: tv-radio-online.apk
          if-no-files-found: error
