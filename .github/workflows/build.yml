name: Android APK

concurrency:
  group: android-apk-v4
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, v3.0, v4.0 ]
  pull_request:
    branches: [ v4.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete V4 implementation
        run: |
          set -e
          test -f app/src/main/java/com/offex7/streamhub/MainActivity_v4.kt.gz
          gunzip -c app/src/main/java/com/offex7/streamhub/MainActivity_v4.kt.gz > app/src/main/java/com/offex7/streamhub/MainActivity.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Locate APK
        run: |
          set -e
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "Found APK: $APK"
          cp "$APK" tv-radio-online-v4.apk
          ls -lh tv-radio-online-v4.apk
      - name: Verify APK signature
        run: |
          set -e
          APK=tv-radio-online-v4.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Radio-Online-v4-APK
          path: tv-radio-online-v4.apk
          if-no-files-found: error
