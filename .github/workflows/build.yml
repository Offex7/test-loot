name: Android APK

concurrency:
  group: android-apk-v4-canonical
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, v3.0, v4.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Restore canonical V4 MainActivity source
        run: |
          set -e
          SRC=app/src/main/java/com/offex7/streamhub/MainActivity.kt
          GZ=app/src/main/java/com/offex7/streamhub/MainActivity_v4.kt.gz
          B64=app/src/main/java/com/offex7/streamhub/MainActivity_v4.kt.b64.part1
          if [ -f "$B64" ]; then
            base64 -d "$B64" > /tmp/MainActivity_v4.kt.gz
            gunzip -c /tmp/MainActivity_v4.kt.gz > "$SRC"
          elif [ -f "$GZ" ]; then
            gunzip -c "$GZ" > "$SRC"
          else
            echo "Canonical V4 source archive is missing" >&2
            exit 1
          fi
          test -s "$SRC"
          grep -q "class MainActivity" "$SRC"
          if grep -q "sessionZoom" "$SRC"; then
            echo "Stale sessionZoom symbol found in canonical source" >&2
            exit 1
          fi
          echo "Canonical source restored: $(wc -c < "$SRC") bytes"
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Locate APK
        run: |
          set -e
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "Found APK: $APK"
          cp "$APK" tv-radio-online-v4.apk
          ls -lh tv-radio-online-v4.apk
      - name: Verify APK signature
        run: |
          set -e
          APK=tv-radio-online-v4.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Radio-Online-v4-APK
          path: tv-radio-online-v4.apk
          if-no-files-found: error
