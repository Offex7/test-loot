      - name: Verify existing signing keystore
        run: |
          set -e
          keytool -list -v -keystore app/signing/radio-tv-v5-debug.keystore -storepass android -alias AndroidDebugKey > key.txt
          grep -q 'Alias name: AndroidDebugKey' key.txt
          grep -q 'Entry type: PrivateKeyEntry' key.txt
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test "$KEY_CERT" = "b848a1f2857ef5d4fd4a2d89be61fd0d6804729f263e4816e6fce2857d91c15a"
          echo "Existing certificate matches."

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Upload debug build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v4.12-debug-build-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Build signed release APK with R8
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK package, version, signature and checksum
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" Radio-TV-v4.12.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose Radio-TV-v4.12.apk
          APK_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs Radio-TV-v4.12.apk | sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test -n "$APK_CERT"
          test "$KEY_CERT" = "$APK_CERT"
          BADGING=$(aapt2 dump badging Radio-TV-v4.12.apk | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.offex7.streamhub'"
          echo "$BADGING" | grep -q "versionCode='26'"
          echo "$BADGING" | grep -q "versionName='4.12'"
          sha256sum Radio-TV-v4.12.apk
          ls -lh Radio-TV-v4.12.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v4.12-APK
          path: Radio-TV-v4.12.apk
          if-no-files-found: error

      - name: Package final source ZIP
        run: git archive --format=zip HEAD -o Radio-TV-v4.12-source.zip

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v4.12-Source
          path: Radio-TV-v4.12-source.zip
          if-no-files-found: error

      - name: Publish direct APK and source download links
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v4.12
          name: Radio.TV v4.12
          # Release metadata mirrors the APK manifest: code 25, version 4.12.
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Radio.TV v4.12

            versionCode: 26
            versionName: 4.12
            Package: com.offex7.streamhub

            APK is signed with the existing v4 signing key. The source archive is attached below.
          files: |
            Radio-TV-v4.12.apk
            Radio-TV-v4.12-source.zip
