              "TV_active_channel_for_stats": "setActiveChannelId(candidate.name)" in tv and "activeChannelId" in player,
              "radio_active_restore": "fun refreshPlaybackState()" in radio_controller and "LaunchedEffect(connected, radioResumeEpoch, index, filteredStations)" in main and "animateScrollToItem(targetIndex)" in main and "activeStationFocusRequester.requestFocus()" in main and "currentMediaItem?.mediaId" in radio_controller,
              "radio_controller_release_safe": "handler.post" in radio_controller and "pendingFuture?.cancel(false)" in radio_controller and "if (released) return" in radio_controller,
              "radio_cold_start_selection_restore": "suspend fun lastStationId(): String?" in radio_timer_store and "restoreSelectedIndex(savedIndex)" in main and "fun restoreSelectedIndex(index: Int)" in radio_controller and "LaunchedEffect(connected, radioResumeEpoch, index, filteredStations)" in main,
              "tv_search_idle_timeout_60s": "delay(60_000L)" in tv and "delay(if (query.isBlank()) 5000L else 15000L)" not in tv,
              "tv_cache_kept_until_refresh": "if (!file.isFile) return@withContext null" in tv_playlist and "repo.cached(sourceKey)" in tv and "repo.load(sourceKey)" in tv and "showing cached channels" in tv,
              "tv_skeleton_shimmer": "tv-skeleton-shimmer" in tv and "Brush.linearGradient" in tv and "TvV9Skeleton()" in tv,
              "remote_cold_start_precedence": "launchRemoteImmediately" in main and "if (launchRemoteImmediately)" in main and "remoteTab = true" in main,
