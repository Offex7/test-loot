name: Build Android APK

concurrency:
  group: android-apk-v4
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - name: Validate V4 sources
        run: |
          set -e
          grep -q 'versionCode = 4' app/build.gradle.kts
          grep -q 'versionName = "4.0"' app/build.gradle.kts
          grep -q 'compileSdk = 34' app/build.gradle.kts
          grep -q 'targetSdk = 34' app/build.gradle.kts
          test -f app/src/main/java/com/offex7/streamhub/MainActivity.kt
          test -f app/src/main/java/com/offex7/streamhub/PlaylistRepository.kt
          test -f app/src/main/res/drawable/qr_donate.xml
      - name: Apply V4 source compatibility fixes
        run: |
          set -e
          SRC=app/src/main/java/com/offex7/streamhub/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/offex7/streamhub/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace("import androidx.activity.BackHandler", "import androidx.activity.compose.BackHandler")
          s = s.replace("import androidx.compose.animation.animateFloatAsState", "import androidx.compose.animation.core.animateFloatAsState")
          s = s.replace("import androidx.compose.foundation.layout.weight\n", "")
          s = s.replace("if (maxWidth >= 560.dp)", "if (LocalConfiguration.current.screenWidthDp >= 560)")
          s = s.replace("player = this@TvPlayer.player.player", "this.player = player.player")
          old = """private fun awaitDisposeCompat(onDispose: () -> Unit): suspend () -> Unit {\n    try {\n        kotlinx.coroutines.awaitCancellation()\n    } finally {\n        onDispose()\n    }\n}"""
          new = """private suspend fun awaitDisposeCompat(onDispose: () -> Unit) {\n    try {\n        kotlinx.coroutines.awaitCancellation()\n    } finally {\n        onDispose()\n    }\n}"""
          s = s.replace(old, new)
          s = s.replace('snack.showSnackbar("Таймер сна — отключён", duration = SnackbarDuration.Short)', 'scope.launch { snack.showSnackbar("Таймер сна — отключён", duration = SnackbarDuration.Short) }')
          p.write_text(s, encoding="utf-8")
          PY
      - name: Validate donation QR resource
        run: |
          set -e
          if test -f app/src/main/res/drawable/qr_donate.png; then
            python3 - <<'PY'
            from pathlib import Path
            b = Path('app/src/main/res/drawable/qr_donate.png').read_bytes()
            assert b.startswith(b'\x89PNG\r\n\x1a\n')
            assert b.endswith(b'IEND\xaeB`\x82'), 'PNG is truncated/corrupt'
            PY
          else
            test -f app/src/main/res/drawable/qr_donate.xml
          fi
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Locate APK
        run: |
          set -e
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "Found APK: $APK"
          cp "$APK" tv-radio-online-v4.0.apk
          ls -lh tv-radio-online-v4.0.apk
      - name: Verify APK signature
        run: |
          set -e
          APK=tv-radio-online-v4.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Radio-Online-v4.0-APK
          path: tv-radio-online-v4.0.apk
          if-no-files-found: error
