name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Validate final v3.8 project
        run: |
          set -e
          grep -q 'versionCode = 11' app/build.gradle.kts
          grep -q 'versionName = "3.8"' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'https://t.me/TvRadioOnline/170311' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'https://t.me/TvRadioOnline/170289' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          test -f app/src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt
          grep -q 'PIN_REAUTH_WINDOW = 5 \* 60 \* 1000L' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'FLAG_SECURE' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' app/src/main/java/com/offex7/streamhub/TvV8Screen.kt
          grep -Fq 'context.dataStore.data.first()[autoStartKey] ?: true' app/src/main/java/com/offex7/streamhub/Storage.kt
          grep -q 'getExternalFilesDir(null)' app/src/main/java/com/offex7/streamhub/LogExporter.kt
          grep -q 'external-files-path' app/src/main/res/xml/file_paths.xml
          grep -q 'contentColor = Color.White' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -Fq 'tools:keep="@drawable/logo_*"' app/src/main/res/values/keep.xml
          grep -q 'https://api.github.com/repos/RadioTV-apk/R/releases/latest' app/src/main/java/com/offex7/streamhub/AppUpdateManager.kt
          grep -q 'Radio-TV-v' app/src/main/java/com/offex7/streamhub/AppUpdateManager.kt
          grep -q 'Проверить обновление' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'onCheckUpdate' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'verticalScroll(scrollState)' app/src/main/java/com/offex7/streamhub/TvV8Screen.kt
          grep -q 'scrollState.scrollTo' app/src/main/java/com/offex7/streamhub/TvV8Screen.kt
          grep -q 'RadioEqualizerDialog' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'verticalScroll(rememberScrollState())' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          test -f app/src/main/java/com/offex7/streamhub/RadioLogoAssetsV38.kt
          test -f app/src/main/assets/radio_logo2.zip
          test -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'StreamItem("ШАНСОН"' app/src/main/java/com/offex7/streamhub/Models.kt
          grep -q 'StreamItem("ДЕТСКОЕ РАДИО"' app/src/main/java/com/offex7/streamhub/Models.kt
          test "$(grep -c 'StreamItem("ШАНСОН"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("МАЯК"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("LOVE"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("ВЕСТИ FM"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("МАРУСЯ FM"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("РАДИО ДАЧА"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("RAP CLASSIC"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("REMIX FM"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("НОВОЕ РАДИО"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("ЮМОР FM"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          test "$(grep -c 'StreamItem("ДЕТСКОЕ РАДИО"' app/src/main/java/com/offex7/streamhub/Models.kt)" -eq 1
          grep -Fq 'header("User-Agent", "Radio.TV/${BuildConfig.VERSION_NAME}")' app/src/main/java/com/offex7/streamhub/AppUpdateManager.kt
          grep -Fq 'Radio-TV-v${version}.apk' app/src/main/java/com/offex7/streamhub/AppUpdateManager.kt
          grep -q 'removePrefix("V")' app/src/main/java/com/offex7/streamhub/AppUpdateManager.kt
          grep -Fq '.txt"' app/src/main/java/com/offex7/streamhub/LogExporter.kt
          grep -q 'type = "text/plain"' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'AnimatedVisibility' app/src/main/java/com/offex7/streamhub/UpdateBannerV38.kt
          grep -q 'verticalScroll(rememberScrollState())' app/src/main/java/com/offex7/streamhub/UpdateBannerV38.kt
          grep -q 'Modifier = Modifier.align(Alignment.BottomCenter)' app/src/main/java/com/offex7/streamhub/MainActivity.kt
          grep -q 'Canvas' app/src/main/java/com/offex7/streamhub/TvV8Screen.kt
          grep -q 'Color.White.copy(alpha = 0.35f)' app/src/main/java/com/offex7/streamhub/TvV8Screen.kt
          grep -q 'delay(3000L)' app/src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt
          grep -q 'delay(5000L)' app/src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt
          grep -q 'canScrollForward' app/src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt
          grep -q 'slideInHorizontally' app/src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt
          grep -q 'KeyboardArrowUp' app/src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt
          grep -q 'vibrate(context, true, 52L, 165)' app/src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected = {"mdpi": (48,48), "hdpi": (72,72), "xhdpi": (96,96), "xxhdpi": (144,144), "xxxhdpi": (192,192)}
          for density, expected_size in expected.items():
              p = Path("app/src/main/res") / f"mipmap-{density}" / "ic_launcher.png"
              b = p.read_bytes()
              got = struct.unpack(">II", b[16:24])
              assert got == expected_size, (density, got, expected_size)
          PY
          if grep -R -q 'Radio.TV/3.7' app/src/main; then echo "stale v3.7 user-agent"; exit 1; fi
          if grep -R -q 'Radio.TV/3.6' app/src/main; then echo "stale v3.6 user-agent"; exit 1; fi
          echo "v3.8 static validation passed"

      - name: Validate signing keystore
        run: |
          set -e
          keytool -list -v -keystore app/signing/radio-tv-v5-debug.keystore -storepass android -alias AndroidDebugKey > key.txt
          grep -q 'Alias name: AndroidDebugKey' key.txt
          grep -q 'Entry type: PrivateKeyEntry' key.txt
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test -n "$KEY_CERT"
          echo "Signing certificate SHA-256: $KEY_CERT"
          test "$KEY_CERT" = "b848a1f2857ef5d4fd4a2d89be61fd0d6804729f263e4816e6fce2857d91c15a"

      - name: Prepare Gradle wrapper
        run: gradle wrapper

      - name: Build debug APK (stability check)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Upload debug build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v3.8-debug-build-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" radio-tv-release-3.8.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose radio-tv-release-3.8.apk
          APK_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs radio-tv-release-3.8.apk | sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test -n "$APK_CERT"
          test "$KEY_CERT" = "$APK_CERT"
          APK_PACKAGE=$(aapt2 dump badging radio-tv-release-3.8.apk | head -n 1)
          echo "$APK_PACKAGE"
          echo "$APK_PACKAGE" | grep -q "name='com.offex7.streamhub'"
          echo "$APK_PACKAGE" | grep -q "versionCode='11'"
          echo "$APK_PACKAGE" | grep -q "versionName='3.8'"
          sha256sum radio-tv-release-3.8.apk
          ls -lh radio-tv-release-3.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-Release-3.8-APK
          path: radio-tv-release-3.8.apk
          if-no-files-found: error

      - name: Package source ZIP
        run: git archive --format=zip HEAD -o Radio-TV-v3.8-source.zip

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v3.8-Source
          path: Radio-TV-v3.8-source.zip
          if-no-files-found: error
