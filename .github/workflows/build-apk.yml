name: Build Android APK
# v3.8 final validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Validate final v3.8 project
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app')
          gradle = (root / 'build.gradle.kts').read_text(encoding='utf-8')
          main = (root / 'src/main/java/com/offex7/streamhub/MainActivity.kt').read_text(encoding='utf-8')
          models = (root / 'src/main/java/com/offex7/streamhub/Models.kt').read_text(encoding='utf-8')
          storage = (root / 'src/main/java/com/offex7/streamhub/Storage.kt').read_text(encoding='utf-8')
          logs = (root / 'src/main/java/com/offex7/streamhub/LogExporter.kt').read_text(encoding='utf-8')
          updater = (root / 'src/main/java/com/offex7/streamhub/AppUpdateManager.kt').read_text(encoding='utf-8')
          banner = (root / 'src/main/java/com/offex7/streamhub/UpdateBannerV38.kt').read_text(encoding='utf-8')
          tv = (root / 'src/main/java/com/offex7/streamhub/TvV8Screen.kt').read_text(encoding='utf-8')
          arrow = (root / 'src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt').read_text(encoding='utf-8')
          manifest = (root / 'src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          checks = {
              'version': 'versionCode = 11' in gradle and 'versionName = "3.8"' in gradle,
              'package': 'applicationId = "com.offex7.streamhub"' in gradle,
              'r8': 'isMinifyEnabled = true' in gradle and 'isShrinkResources = true' in gradle,
              'telegram': '170311' in main and '170289' in main,
              'pin': 'PIN_REAUTH_WINDOW = 5 * 60 * 1000L' in main,
              'secure': 'FLAG_SECURE' in main,
              'cutout': 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' in tv,
              'logs': 'getExternalFilesDir(null)' in logs and '.txt' in logs,
              'share': 'type = "text/plain"' in main,
              'updater': 'https://api.github.com/repos/RadioTV-apk/R/releases/latest' in updater and 'Radio-TV-v${version}.apk' in updater and 'removePrefix("V")' in updater,
              'update_banner': 'AnimatedVisibility' in banner and 'verticalScroll' in banner,
              'tv_picker': 'verticalScroll(scrollState)' in tv and 'Canvas' in tv,
              'arrow': 'delay(3000L)' in arrow and 'delay(5000L)' in arrow and 'slideInHorizontally' in arrow and 'canScrollForward' in arrow,
              'autostart': 'autoStartKey' in storage,
              'keystore': (root / 'signing/radio-tv-v5-debug.keystore').is_file(),
              'manifest': 'android:icon="@mipmap/ic_launcher"' in manifest and 'android:roundIcon="@mipmap/ic_launcher_round"' in manifest,
              'assets': (root / 'src/main/assets/radio_logo2.zip').is_file() and (root / 'src/main/java/com/offex7/streamhub/RadioLogoAssetsV38.kt').is_file(),
              'main_files': all((root / 'src/main/java/com/offex7/streamhub' / name).is_file() for name in ['MainActivity.kt','Storage.kt','PlayerController.kt','RadioMediaController.kt','TvV8Screen.kt','ScrollTopButtonV37.kt']),
              'no_stale_ua': 'Radio.TV/3.6' not in main and 'Radio.TV/3.7' not in main,
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              raise SystemExit('Validation failed: ' + ', '.join(missing))
          for path in [root / 'src/main/res/mipmap-mdpi/ic_launcher.png', root / 'src/main/res/mipmap-hdpi/ic_launcher.png', root / 'src/main/res/mipmap-xhdpi/ic_launcher.png', root / 'src/main/res/mipmap-xxhdpi/ic_launcher.png', root / 'src/main/res/mipmap-xxxhdpi/ic_launcher.png', root / 'src/main/res/drawable-nodpi/ic_launcher_foreground.png']:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Invalid launcher asset: {path}')
          print('v3.8 static validation: OK')
          PY
      - name: Validate signing keystore
        run: |
          set -e
          keytool -list -v -keystore app/signing/radio-tv-v5-debug.keystore -storepass android -alias AndroidDebugKey > key.txt
          grep -q 'Alias name: AndroidDebugKey' key.txt
          grep -q 'Entry type: PrivateKeyEntry' key.txt
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test -n "$KEY_CERT"
          echo "Signing certificate SHA-256: $KEY_CERT"
          test "$KEY_CERT" = "b848a1f2857ef5d4fd4a2d89be61fd0d6804729f263e4816e6fce2857d91c15a"

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK (stability check)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Upload debug build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v3.8-debug-build-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" radio-tv-release-3.8.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose radio-tv-release-3.8.apk
          APK_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs radio-tv-release-3.8.apk | sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test -n "$APK_CERT"
          test "$KEY_CERT" = "$APK_CERT"
          APK_PACKAGE=$(aapt2 dump badging radio-tv-release-3.8.apk | head -n 1)
          echo "$APK_PACKAGE"
          echo "$APK_PACKAGE" | grep -q "name='com.offex7.streamhub'"
          echo "$APK_PACKAGE" | grep -q "versionCode='11'"
          echo "$APK_PACKAGE" | grep -q "versionName='3.8'"
          sha256sum radio-tv-release-3.8.apk
          ls -lh radio-tv-release-3.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-Release-3.8-APK
          path: radio-tv-release-3.8.apk
          if-no-files-found: error

      - name: Package source ZIP
        run: git archive --format=zip HEAD -o Radio-TV-v3.8-source.zip

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v3.8-Source
          path: Radio-TV-v3.8-source.zip
          if-no-files-found: error
