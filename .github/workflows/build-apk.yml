              "UA_v4_8": '"Radio.TV/4.8"' in main and '"Radio.TV/4.3"' not in main and '"Radio.TV/4.2"' not in main and '"Radio.TV/4.1"' not in main and '"TV-Radio-Online/5.0"' not in main,
              "UA_tv_playlist_repository": tv_playlist.count('"Radio.TV/4.8"') >= 2 and '"Radio.TV/4.3"' not in tv_playlist and '"Radio.TV/9.0"' not in tv_playlist,
              "UA_radio_playlist_repository": '"Radio.TV/4.8"' in playlist and '"Radio.TV/4.3"' not in playlist and "TV-Radio-Online/7.0" not in playlist,
              "scroll_arrow_grown": "Modifier.size(36.dp)" in arrows,
              "scroll_arrow_timing_and_programmatic_guard": "delay(2_000L)" in arrows and "delay(5_000L)" in arrows and "ignoreProgrammaticScroll" in arrows,
              "updater_endpoint_preserved": "https://api.github.com/repos/RadioTV-apk/R/releases/latest" in (root / "src/main/java/com/offex7/streamhub/AppUpdateManager.kt").read_text(encoding="utf-8"),
              "energy_warning_92h": "92L * 60L * 60L * 1000L" in storage and "markEnergyWarningShown()" in main,
              "stats_timestamp_session": "data class UsageSession" in storage and "usageSessionFlow(Section.TV)" in main and "activeChannelId.value" in main and "addPlaybackUsage(section" in main,
