name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-34"             "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Validate V6 sources
        run: |
          set -e
          grep -q 'versionCode = 6' app/build.gradle.kts
          grep -q 'versionName = "6.0"' app/build.gradle.kts
          grep -q 'compileSdk = 34' app/build.gradle.kts
          grep -q 'targetSdk = 34' app/build.gradle.kts
          grep -q 'applicationId = "com.offex7.streamhub"' app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:label="Radio.TV"' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/offex7/streamhub/MainActivity.kt
          test -f app/src/main/java/com/offex7/streamhub/PlaylistRepository.kt
          test -f app/src/main/java/com/offex7/streamhub/PlayerController.kt
          test -f app/src/main/java/com/offex7/streamhub/RadioMediaController.kt
          test -f app/src/main/java/com/offex7/streamhub/Storage.kt
          test -f app/signing/radio-tv-v5-debug.keystore
          KEY_FP=$(keytool -list -v -keystore app/signing/radio-tv-v5-debug.keystore -storepass android -alias AndroidDebugKey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test "$KEY_FP" = "b848a1f2857ef5d4fd4a2d89be61fd0d6804729f263e4816e6fce2857d91c15a"

      - name: Validate V6 signing key
        run: |
          set -e
          keytool -list -v             -keystore app/signing/radio-tv-v5-debug.keystore             -storepass android             -alias AndroidDebugKey > key.txt
          grep -q 'Alias name: AndroidDebugKey' key.txt
          grep -q 'Entry type: PrivateKeyEntry' key.txt
          sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" tv-radio-online-v6.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose tv-radio-online-v6.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs tv-radio-online-v6.0.apk
          sha256sum tv-radio-online-v6.0.apk
          APK_PACKAGE=$(aapt2 dump badging tv-radio-online-v6.0.apk | head -n 1)
          echo "$APK_PACKAGE"
          echo "$APK_PACKAGE" | grep -q "name='com.offex7.streamhub'"
          echo "$APK_PACKAGE" | grep -q "versionCode='6'"
          echo "$APK_PACKAGE" | grep -q "versionName='6.0'"
          APK_FP=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs tv-radio-online-v6.0.apk | sed -n 's/.*certificate SHA-256 digest: //p' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test -n "$APK_FP"
          test "$APK_FP" = "$KEY_FP"
          ls -lh tv-radio-online-v6.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Radio-Online-v6.0-APK
          path: tv-radio-online-v6.0.apk
          if-no-files-found: error