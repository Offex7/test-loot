name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-android-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Verify committed v4.4 source version
        run: |
          set -e
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "4.4"' app/build.gradle.kts

      - name: Install and checksum the provided Unistar logo
        run: |
          set -e
          python3 tools/fix_unistar_logo.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix(v4.4): install verified local Unistar logo"
            git push origin HEAD:main
          fi

      - name: Validate Radio.TV v4.4 sources
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("app")
          gradle = (root / "build.gradle.kts").read_text(encoding="utf-8")
          main = (root / "src/main/java/com/offex7/streamhub/MainActivity.kt").read_text(encoding="utf-8")
          media = (root / "src/main/java/com/offex7/streamhub/RadioPlaybackService.kt").read_text(encoding="utf-8")
          player = (root / "src/main/java/com/offex7/streamhub/PlayerController.kt").read_text(encoding="utf-8")
          tv = (root / "src/main/java/com/offex7/streamhub/TvV8Screen.kt").read_text(encoding="utf-8")
          tv_playlist = (root / "src/main/java/com/offex7/streamhub/TvPlaylistRepositoryV8.kt").read_text(encoding="utf-8")
          playlist = (root / "src/main/java/com/offex7/streamhub/PlaylistRepository.kt").read_text(encoding="utf-8")
          radio_controller = (root / "src/main/java/com/offex7/streamhub/RadioMediaController.kt").read_text(encoding="utf-8")
          shortcuts = (root / "src/main/res/xml/shortcuts.xml").read_text(encoding="utf-8")
          logo_assets = (root / "src/main/java/com/offex7/streamhub/RadioLogoAssetsV38.kt").read_text(encoding="utf-8")
          arrows = (root / "src/main/java/com/offex7/streamhub/ScrollTopButtonV37.kt").read_text(encoding="utf-8")
          radio_widget = (root / "src/main/res/xml/widget_radio_info.xml").read_text(encoding="utf-8")
          tv_widget = (root / "src/main/res/xml/widget_tv_info.xml").read_text(encoding="utf-8")
          strings = (root / "src/main/res/values/strings.xml").read_text(encoding="utf-8")
          manifest = (root / "src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          storage = (root / "src/main/java/com/offex7/streamhub/Storage.kt").read_text(encoding="utf-8")
          checks = {
              "version": "versionCode = 17" in gradle and 'versionName = "4.4"' in gradle,
              "remote_modules": all((Path(name) / "build.gradle.kts").is_file() for name in ("tvremote-ui", "tvremote-core", "tvremote-companion", "tvremote-cast")),
              "remote_tab": "TvRemotePadScreen" in main and 'Text("Пульт"' in main and "onOpenRemote" in main,
              "companion_lifecycle": "companionClient.pause()" in main and "companionClient.resume()" in main and "companionClient.close()" in main,
              "companion_service_lifecycle": (root / "src/main/java/com/offex7/streamhub/RadioTvCompanionService.kt").is_file() and ".RadioTvCompanionService" in manifest,
              "logo_pulse_only_active": 'if (activeRadio && radioPlaying && !energySaving)' in main and 'rememberInfiniteTransition(label = "radio-logo-pulse-active")' in main,
              "version_label": 'append("v$APP_VERSION")' in main,
              "application_id": 'applicationId = "com.offex7.streamhub"' in gradle,
              "R8": "isMinifyEnabled = true" in gradle and "isShrinkResources = true" in gradle,
              "original_signing_key": (root / "signing/radio-tv-v5-debug.keystore").is_file(),
              "telegram_links": "170311" in main and "170289" in main,
              "secure_screen": "FLAG_SECURE" in main,
              "PIN_prompt_hidden_and_landscape": "showPinEntry" in main and 'setNegativeButtonText("Ввести PIN")' in main and "ОТСКАНИРУЙТЕ ОТПЕЧАТОК ПАЛЬЦА" not in main and "activity.requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_PORTRAIT" not in main,
              "biometric_lockout_bypass_preserved": "if (!biometricAvailable) return" in main and "biometricAvailable && lockoutRemaining <= 0L" not in main,
              "battery_status_safe": "isIgnoringBatteryOptimizations" in main and "isBackgroundRestricted" in main and "getOrNull()" in main and "shouldWarnAboutBackgroundLimits" in main,
              "log_share_intent": 'val shared = shareText(settingsContext, logText, "Поделиться логами Radio.TV", showFailureToast = false)' in main and 'notify("Скопировано", if (shared) 3000L else 2000L)' in main and "Intent.createChooser(sendIntent, chooserTitle).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)" in main,
              "share_icon_pulse": "log-share-pulse" in main and "if (energySaving) 1f else logSharePulse" in main,
              "all_switch_feedback": main.count("toggleFeedback()") >= 7 and "store.setHapticsEnabled(enabled)" in main and "store.setSoundFeedbackEnabled(enabled)" in main,
              "autostart_above_haptics": main.index('Text("АВТОЗАПУСК"') < main.index('Text("ВИБРАЦИОННЫЙ ОТКЛИК"'),
              "sound_above_pip": main.index('Text("ЗВУКОВОЙ ОТКЛИК"') < main.index('Text("КАРТИНКА В КАРТИНКЕ"'),
              "autostart_description": "Запуск после включения" not in main and "Экран не будет блокироваться, пока приложение активно" in main,
              "update_button": "ОБНОВИТЬ ПРИЛОЖЕНИЕ" in main and "ПРОВЕРИТЬ ОБНОВЛЕНИЕ" not in main,
              "radius_logo_local": (root / "src/main/res/drawable-nodpi/radius_fm_logo.jpg").is_file() and "R.drawable.radius_fm_logo" in main,
              "radius_media_art": "setArtworkData(stationArtworkBytes(station.name)" in media and "stationArtworkBytes" in media,
              "media_local_logo_cache": "fun bitmap(context: Context, stationName: String)" in logo_assets,
              "widget_radio_label_preview": 'android:label="@string/widget_radio_label"' in radio_widget and 'android:previewImage="@drawable/start_radio_v2"' in radio_widget and '<string name="widget_radio_label">Радио</string>' in strings,
              "widget_tv_label_preview": 'android:label="@string/widget_tv_label"' in tv_widget and 'android:previewImage="@drawable/start_tv_final"' in tv_widget and '<string name="widget_tv_label">Телевизор</string>' in strings,
              "widget_receivers": ".RadioWidgetProvider" in manifest and ".TvWidgetProvider" in manifest,
              "TV_reset_copy": "Счётчик Телевизора сброшен" in main and "Счётчик ТВ сброшен" not in main,
              "recommendation": "🎬 Прямой телеэфир и радиовещание без рекламы и подписок?" in main and "P.S. Сообщение пересылаю лично" in main,
              "UA_v4_4": '"Radio.TV/4.4"' in main and '"Radio.TV/4.3"' not in main and '"Radio.TV/4.2"' not in main and '"Radio.TV/4.1"' not in main and '"TV-Radio-Online/5.0"' not in main,
              "UA_tv_playlist_repository": tv_playlist.count('"Radio.TV/4.4"') >= 2 and '"Radio.TV/4.3"' not in tv_playlist and '"Radio.TV/9.0"' not in tv_playlist,
              "UA_radio_playlist_repository": '"Radio.TV/4.4"' in playlist and '"Radio.TV/4.3"' not in playlist and "TV-Radio-Online/7.0" not in playlist,
              "scroll_arrow_grown": "Modifier.size(36.dp)" in arrows,
              "scroll_arrow_timing_and_programmatic_guard": "delay(3000L)" in arrows and "delay(5000L)" in arrows and "ignoreProgrammaticScroll" in arrows,
              "updater_endpoint_preserved": "https://api.github.com/repos/RadioTV-apk/R/releases/latest" in (root / "src/main/java/com/offex7/streamhub/AppUpdateManager.kt").read_text(encoding="utf-8"),
              "energy_warning_92h": "92L * 60L * 60L * 1000L" in storage and "markEnergyWarningShown()" in main,
              "stats_timestamp_session": "data class UsageSession" in storage and "usageSessionFlow(Section.TV)" in main and "activeChannelId.value" in main and "addPlaybackUsage(section" in main,
              "stats_top3_sorted_and_minute_threshold": ".filter { it.value >= 60L }" in main and "compareByDescending<Map.Entry<String, Long>>" in main,
              "landscape_equalizer": "dialogMaxHeight" in main and "verticalScroll(rememberScrollState())" in main and "FlowRow" in main,
              "unistar_local_logo": (root / "src/main/res/drawable-nodpi/unistar_logo.jpg").is_file() and hashlib.sha256((root / "src/main/res/drawable-nodpi/unistar_logo.jpg").read_bytes()).hexdigest() == "161d14948fb51c243d32ac1799fe881835ec4c94c070c89d928fecd4cc1eafb8" and "R.drawable.unistar_logo" in main,
              "share_chooser_flags": "Intent.createChooser(sendIntent, chooserTitle).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)" in main and "Intent.EXTRA_TEXT" in main and 'type = "text/plain"' in main,
              "reset_confirmation": "ВОССТАНОВИТЬ ПО УМОЛЧАНИЮ" in main and "Восстановить настройки по умолчанию?" in main and 'Text("Да", color = Red)' in main and 'Text("Нет")' in main,
              "update_banner_bottom": main.rindex("ОБНОВИТЬ ПРИЛОЖЕНИЕ") > main.rindex("ОТКАЗ ОТ ОТВЕТСТВЕННОСТИ"),
              "app_shortcuts": "android.app.shortcuts" in manifest and "open_radio" in shortcuts and "open_tv" in shortcuts and "widget_section" in shortcuts,
              "TV_timers_2s_25s": "WEAK_NETWORK_NOTICE_MS = 2_000L" in player and "BUFFER_TIMEOUT_MS = 25_000L" in player and "Буферизация не завершилась за 25 секунд" in player,
              "TV_fast_switch_silent": "suppressRecovery = fastSwitch" in tv and "silentSwitching" in tv and "!silentSwitching" in tv and "attemptTimeoutMs = 25_000L" in tv,
              "TV_banner_after_settle": "LaunchedEffect(channel.key, switching, silentSwitching)" in tv and "channelNotice = silentSwitching" in tv and "delay(3000L)" in tv,
              "TV_candidate_stays_until_timeout": "selectedIndex = cursor" in tv and "attemptTimeoutMs = 25_000L" in tv and "suppressChannelNotice" not in tv,
              "TV_active_row_highlight": "active = selectedIndex in channels.indices && channels[selectedIndex].key == channel.key" in tv and "border = if (active) BorderStroke(2.dp, TvV9Red) else null" in tv,
              "TV_banner_fade": "exit = fadeOut(animationSpec = tween(260))" in tv and "enter = fadeIn(animationSpec = tween(180))" in tv,
              "TV_ready_signal_prevents_false_failover": "currentPlayer.playbackState == Player.STATE_READY" in player and "if (currentPlayer.isPlaying)" in player and "Буфер заполнен на 100%" in player,
              "TV_fast_switch_state": "fullscreen && (player.isPlaying.value || player.player.playWhenReady)" in tv,
              "TV_automatic_recovery": "automaticRecovery = true" in tv and "Не удалось воспроизвести канал, переключаю на следующий" in tv and "autoRecoveryTargets" in tv,
              "TV_active_channel_for_stats": "setActiveChannelId(candidate.name)" in tv and "activeChannelId" in player,
              "radio_active_restore": "fun refreshPlaybackState()" in radio_controller and "Lifecycle.Event.ON_RESUME" in main and "animateScrollToItem(targetIndex)" in main and "activeStationFocusRequester.requestFocus()" in main,
              "radio_controller_release_safe": "handler.post" in radio_controller and "pendingFuture?.cancel(false)" in radio_controller and "if (released) return" in radio_controller,
              "TV_neighbor_precheck_types": "val pending = neighbors.filter { health[it.url] == null }" in tv,
              "autostart_and_keep_screen_on": "autoStartKey" in storage and "FLAG_KEEP_SCREEN_ON" in main,
          }
          # v4.4 feature-specific regression checks.
          remote_runtime = Path("app/src/main/java/com/offex7/streamhub/RemoteControlRuntime.kt").read_text(encoding="utf-8")
          remote_settings = Path("tvremote-ui/src/main/java/com/radiotv/control/ui/TvRemoteSettingsScreen.kt").read_text(encoding="utf-8")
          updater = (root / "src/main/java/com/offex7/streamhub/AppUpdateManager.kt").read_text(encoding="utf-8")
          update_banner = (root / "src/main/java/com/offex7/streamhub/UpdateBannerV38.kt").read_text(encoding="utf-8")
          cast_module = Path("tvremote-cast/src/main/java/com/radiotv/control/cast/DlnaDiscovery.kt").read_text(encoding="utf-8")
          checks.update({
              "remote_settings_are_separate": "TvRemoteSettingsScreen" in main and "remoteSettingsVisible = true" in main and "onSettings = { settings = true }" not in main and "НАСТРОЙКИ ПУЛЬТА" in remote_settings,
              "remote_fallback_transports": all(x in remote_runtime for x in ("AndroidTvRemoteV2Transport", "AdbRemoteDevice", "BluetoothHidController", "remoteV2.sendKey", "adb.sendKey", "bluetooth.sendRemoteKey")),
              "remote_voice_airmouse_touchpad": "AndroidTvVoiceInputController" in remote_runtime and "GyroAirMouseController" in remote_runtime and "TouchpadSurface" in main and "VOICE_INPUT" in main and "AIR_MOUSE" in main and "adb.sendKey(231)" in remote_runtime,
              "remote_dlna_cast": "DlnaCastController" in remote_runtime and "discoverRenderers()" in cast_module and "castFilePicker.launch" in main,
              "remote_status_indicator": "Подключено: Android TV Remote v2" in main and "Подключено: ADB" in main and "Нет соединения" in main,
              "TV_loading_splash": "TvLoadingSplash" in tv and "rememberInfiniteTransition" in tv and "drawRoundRect" in tv and '"Загрузка" + ".".repeat(dots)' in tv,
              "TV_waits_for_buffer_100": "(!isPlaying && bufferPercent >= 100)" in tv and "bufferPercent.coerceIn(0, 100)" in tv,
              "TV_signal_lost_and_25s_recovery": "Сигнал утерян, перепроверьте подключение к сети" in tv and "signalLossStartedAt" in tv and "25_000L - (System.currentTimeMillis() - lostAt)" in tv and "startPlayback(next, automaticRecovery = true)" in tv,
              "TV_source_dialog_back_and_disabled_sources": "BackHandler(enabled = sourcePickerVisible)" in tv and "onDismissRequest = { sourcePickerVisible = false }" in tv and "Range" in tv and "bytes=0-0" in tv and "enabled = available" in tv and "Color(0xFF78909C)" in tv,
              "updater_resumable_and_retry": 'header("Range", "bytes=" + offset + "-")' in updater and "MAX_DOWNLOAD_ATTEMPTS = 3" in updater and "Content-Range" in updater,
              "updater_integrity_before_install": "ZipFile(apk)" in updater and "GET_SIGNING_CERTIFICATES" in updater and "archive.packageName == context.packageName" in updater and "temp.renameTo(target)" in updater,
              "updater_failure_message": "Не удалось скачать обновление. Проверьте стабильность соединения и попробуйте позже" in updater,
              "update_dialog_typography": "fontSize = 12.sp" in update_banner and "lineHeight = 17.sp" in update_banner and "heightIn(max = maxPanelHeight)" in update_banner and "verticalScroll(rememberScrollState())" in update_banner,
              "telegram_star_rounded": "quadraticTo(current.x, current.y, end.x, end.y)" in main and "drawPath(path, Color(0xFFFFD740))" in main and '"★"' not in main,
              "radio_timer_only_while_playing": "timerAwaitingAudioStart" in main and "LaunchedEffect(playing, index, timerTargetKey, timerAwaitingAudioStart)" in main and "if (playing && stationKey != null" in main and "timerStore.reset()" in main,
              "scroll_arrow_manual_only_3_5": "delay(3000L)" in arrows and "delay(5000L)" in arrows and "listState.isScrollInProgress && awayFromTop" in arrows and "ignoreProgrammaticScroll" in arrows,
              "orientation_system_managed": 'android:screenOrientation="unspecified"' in manifest and "SensorManager" not in main and "TYPE_ACCELEROMETER" not in main,
              "versioned_user_agent_all_clients": '"Radio.TV/4.4"' in main and '"Radio.TV/4.4"' in playlist and tv_playlist.count('"Radio.TV/4.4"') >= 2,
          })
          failures = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + name)
          if failures:
              raise SystemExit("v4.4 source validation failed: " + ", ".join(failures))
          print("All Radio.TV v4.4 source checks passed.")
          PY

      - name: Verify existing signing keystore
        run: |
          set -e
          keytool -list -v -keystore app/signing/radio-tv-v5-debug.keystore -storepass android -alias AndroidDebugKey > key.txt
          grep -q 'Alias name: AndroidDebugKey' key.txt
          grep -q 'Entry type: PrivateKeyEntry' key.txt
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test "$KEY_CERT" = "b848a1f2857ef5d4fd4a2d89be61fd0d6804729f263e4816e6fce2857d91c15a"
          echo "Existing certificate matches."

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Upload debug build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v4.4-debug-build-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Build signed release APK with R8
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK package, version, signature and checksum
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" Radio-TV-v4.4.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose Radio-TV-v4.4.apk
          APK_CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs Radio-TV-v4.4.apk | sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          KEY_CERT=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          test -n "$APK_CERT"
          test "$KEY_CERT" = "$APK_CERT"
          BADGING=$(aapt2 dump badging Radio-TV-v4.4.apk | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.offex7.streamhub'"
          echo "$BADGING" | grep -q "versionCode='17'"
          echo "$BADGING" | grep -q "versionName='4.4'"
          sha256sum Radio-TV-v4.4.apk
          ls -lh Radio-TV-v4.4.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v4.4-APK
          path: Radio-TV-v4.4.apk
          if-no-files-found: error

      - name: Package final source ZIP
        run: git archive --format=zip HEAD -o Radio-TV-v4.4-source.zip

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-TV-v4.4-Source
          path: Radio-TV-v4.4-source.zip
          if-no-files-found: error
