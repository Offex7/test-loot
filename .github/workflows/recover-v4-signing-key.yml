name: Recover V4 Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact V4 source
        run: |
          git fetch origin 0f3028929480f29bc1deb4d4b6bda2ca2ca6d6c1
          git checkout --detach 0f3028929480f29bc1deb4d4b6bda2ca2ca6d6c1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - name: Apply the same V4 CI compatibility fixes
        run: |
          set -e
          SRC=app/src/main/java/com/offex7/streamhub/MainActivity.kt
          sed -i 's/import androidx.activity.BackHandler/import androidx.activity.compose.BackHandler/' "$SRC"
          sed -i 's/import androidx.compose.animation.animateFloatAsState/import androidx.compose.animation.core.animateFloatAsState/' "$SRC"
          sed -i '/import androidx.compose.foundation.layout.weight/d' "$SRC"
          sed -i 's/if (maxWidth >= 560.dp)/if (LocalConfiguration.current.screenWidthDp >= 560)/' "$SRC"
          sed -i 's/player = this@TvPlayer.player.player/this.player = player.player/' "$SRC"
          python3 -c "from pathlib import Path; p=Path('$SRC'); s=p.read_text(encoding='utf-8'); old='private fun awaitDisposeCompat(onDispose: () -> Unit): suspend () -> Unit {\n    try {\n        kotlinx.coroutines.awaitCancellation()\n    } finally {\n        onDispose()\n    }\n}'; new='private suspend fun awaitDisposeCompat(onDispose: () -> Unit) {\n    try {\n        kotlinx.coroutines.awaitCancellation()\n    } finally {\n        onDispose()\n    }\n}'; p.write_text(s.replace(old,new),encoding='utf-8')"
          sed -i 's/snack.showSnackbar("Таймер сна — отключён", duration = SnackbarDuration.Short)/scope.launch { snack.showSnackbar("Таймер сна — отключён", duration = SnackbarDuration.Short) }/' "$SRC"
          sed -i 's/^package com.offex7.streamhub/@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class, androidx.compose.foundation.ExperimentalFoundationApi::class)\npackage com.offex7.streamhub/' "$SRC"
      - name: Build V4 debug APK and capture the exact key
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace
          KEY="$HOME/.config/.android/debug.keystore"
          test -f "$KEY"
          keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey | tee key.txt
          echo "V4 DEBUG KEY SHA-256:"
          sed -n 's/^[[:space:]]*SHA-256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]'
          cp "$KEY" v4-debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: V4-debug-keystore-exact
          path: v4-debug.keystore
          if-no-files-found: error
