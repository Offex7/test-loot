name: Capture V4 Debug Keystore

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact V4 snapshot
        run: |
          git fetch origin 0f3028929480f29bc1deb4d4b6bda2ca2ca6d6c1
          git checkout --detach 0f3028929480f29bc1deb4d4b6bda2ca2ca6d6c1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - name: Trigger default debug signing key generation
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace
          build_rc=$?
          echo "assembleDebug exit=$build_rc"
          set -e
          KEY="$HOME/.config/.android/debug.keystore"
          if [ ! -f "$KEY" ]; then
            KEY=$(find "$HOME" -type f -name debug.keystore | head -1)
          fi
          test -n "$KEY"
          test -f "$KEY"
          keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey | tee key.txt
          SHA=$(sed -n 's/^[[:space:]]*SHA-256:[[:space:]]*//p' key.txt | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          echo "V4 APK expected SHA-256=7fc17653bf2ff0e1e4c95a5550052043049d2e28714c7f049a28f797194ed8cc"
          echo "Generated SHA-256=$SHA"
          cp "$KEY" v4-debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: v4-debug-keystore-exact
          path: v4-debug.keystore
          if-no-files-found: error
