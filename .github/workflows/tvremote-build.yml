name: TV Remote Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tvremote-v1
    paths:
      - "tvremote-project/app/**"
      - "tvremote-project/tvremote-core/**"
      - "tvremote-project/tvremote-ui/**"
      - "tvremote-project/tvremote-cast/**"
      - "tvremote-project/settings.gradle.kts"
      - "tvremote-project/build.gradle.kts"
      - "tvremote-project/gradle.properties"
      - "tvremote-project/gradle/**"
      - ".github/workflows/tvremote-build.yml"

permissions:
  contents: read

concurrency:
  group: tvremote-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        working-directory: tvremote-project
        run: timeout 10m gradle :tvremote-core:test --no-daemon --max-workers=2 --stacktrace --info

      - name: Assemble debug APK
        working-directory: tvremote-project
        run: timeout 10m gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace --info

      - name: Verify APK
        working-directory: tvremote-project
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/tvremote-badging.txt
          grep -q "package: name='com.radiotv.tvremote' versionCode='1' versionName='1.0.0'" /tmp/tvremote-badging.txt
          grep -q "sdkVersion:'26'" /tmp/tvremote-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/tvremote-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/tvremote-manifest.txt
          grep -A3 -q "usesCleartextTraffic" /tmp/tvremote-manifest.txt && grep -A3 "usesCleartextTraffic" /tmp/tvremote-manifest.txt | grep -q "0xffffffff"
          grep -A3 "screenOrientation" /tmp/tvremote-manifest.txt | grep -q "0x1"
          sha256sum "$APK" | tee /tmp/tvremote-sha256.txt
          stat -c 'APK size: %s bytes' "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-debug-run-${{ github.run_number }}
          path: tvremote-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
