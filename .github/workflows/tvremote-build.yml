name: TV Remote Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tvremote-v1
    paths:
      - "tvremote-project/**"
      - ".github/workflows/tvremote-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests and debug APK
        working-directory: tvremote-project
        run: gradle :tvremote-core:test :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-debug
          path: tvremote-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
