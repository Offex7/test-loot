name: Inspect Android Debug Key

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - name: Build current debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Inspect debug key and certificate
        run: |
          set -e
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "DEBUG_KEY_CANDIDATES:"
          find "$HOME" -path "*/.android/debug.keystore" -type f -print || true
          KEY="$HOME/.config/.android/debug.keystore"
          if [ ! -f "$KEY" ]; then KEY="$HOME/.android/debug.keystore"; fi
          test -f "$KEY"
          keytool -list -v -keystore "$KEY" -storepass android -alias AndroidDebugKey
          cp "$KEY" android-debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-keystore-v5-inspection
          path: android-debug.keystore
          if-no-files-found: error
