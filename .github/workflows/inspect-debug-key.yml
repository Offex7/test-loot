name: Inspect Android Debug Key

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runner debug keystore
        run: |
          set -e
          KEY="$HOME/.config/.android/debug.keystore"
          if [ ! -f "$KEY" ]; then KEY="$HOME/.android/debug.keystore"; fi
          test -f "$KEY"
          keytool -list -v -keystore "$KEY" -storepass android -alias AndroidDebugKey | tee key.txt
          FINGERPRINT=$(sed -n 's/^\s*SHA256:\s*//p' key.txt | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')
          echo "V4 expected SHA-256: 0a4d5b1d4fba168800fbece07e0f33c2b3651fa219ccb150828075ae8eaae6bf"
          echo "Runner debug SHA-256: $FINGERPRINT"
          test "$FINGERPRINT" = "0a4d5b1d4fba168800fbece07e0f33c2b3651fa219ccb150828075ae8eaae6bf"
          cp "$KEY" android-debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: v4-debug-keystore
          path: android-debug.keystore
          if-no-files-found: error
