name: Radio.TV.Control Android CI

on:
  push:
    branches:
      - feature/radiotv-control-v1
    paths:
      - "Radio.TV.Control/**"
      - "ci/**"
      - ".github/workflows/radiotv-control-ci.yml"
  pull_request:
    paths:
      - "Radio.TV.Control/**"
      - ".github/workflows/radiotv-control-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, test and inspect APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Radio.TV.Control
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify stable project signing key is available
        run: test -s ../app/signing/radio-tv-v5-debug.keystore
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Assemble debug APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
      - name: Run core tests
        run: gradle --no-daemon --console=plain --stacktrace :tvremote-core:test
      - name: Verify APK, manifest, DEX modules, hash and size
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.radiotv.control'" badging.txt
          grep -F "sdkVersion:'31'" badging.txt
          grep -F "targetSdkVersion:'37'" badging.txt
          grep -F "application-label:'Radio.TV.Control'" badging.txt
          grep -F "versionCode='${{ github.run_number }}'" badging.txt
          APK_ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -n "$APK_ANALYZER" || { echo "apkanalyzer not found under $ANDROID_HOME/cmdline-tools"; exit 1; }
          "$APK_ANALYZER" manifest print "$APK" > manifest.xml
          # Android ActivityInfo.SCREEN_ORIENTATION_PORTRAIT is encoded as 1 in the APK manifest.
          grep -Eq 'android:screenOrientation([^=]*)="1"' manifest.xml || { echo "Manifest portrait-orientation check failed (expected SCREEN_ORIENTATION_PORTRAIT=1)"; cat manifest.xml; exit 1; }
          grep -Eq 'android:usesCleartextTraffic([^=]*)="true"' manifest.xml || { echo "Manifest cleartext check failed"; cat manifest.xml; exit 1; }
          grep -F 'android.permission.ACCESS_LOCAL_NETWORK' manifest.xml || { echo "Manifest local-network permission check failed"; cat manifest.xml; exit 1; }
          grep -F 'android.permission.BLUETOOTH_ADVERTISE' manifest.xml || { echo "Manifest Bluetooth advertise permission check failed"; cat manifest.xml; exit 1; }
          grep -F 'android.permission.RECORD_AUDIO' manifest.xml || { echo "Manifest microphone permission check failed"; cat manifest.xml; exit 1; }
          mkdir -p artifact-out
          cp "$APK" artifact-out/Radio.TV.Control-debug.apk
          unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$' | while read -r dex; do unzip -p "$APK" "$dex"; done | strings > dex-strings.txt
          grep -F 'AndroidTvRemoteV2Transport' dex-strings.txt
          grep -F 'TvRemotePad' dex-strings.txt
          grep -F 'DlnaCastController' dex-strings.txt
          grep -F 'LocalNetworkDeviceDiscovery' dex-strings.txt
          grep -F 'BluetoothHidController' dex-strings.txt
          grep -F 'GyroAirMouseController' dex-strings.txt
          grep -F 'AndroidTvVoiceInputController' dex-strings.txt
          grep -F 'OtherTvRemoteController' dex-strings.txt
          grep -F 'SetAVTransportURI' dex-strings.txt
          grep -F 'TouchpadSurface' dex-strings.txt
          sha256sum artifact-out/Radio.TV.Control-debug.apk | tee sha256.txt
          stat -c 'APK_SIZE_BYTES=%s' artifact-out/Radio.TV.Control-debug.apk | tee size.txt
      - name: Capture UI screenshots with Robolectric and Compose (JVM, no emulator)
        if: github.event_name != 'pull_request'
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Validate and stage Robolectric screenshots
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="app/build/outputs/roborazzi/radio-tv-screenshots"
          OUTPUT_DIR="app/ui-screenshots"
          mkdir -p "$OUTPUT_DIR"
          for file in remote.png digital-panel.png settings.png; do
            test -s "$SOURCE_DIR/$file" || { echo "Missing Robolectric screenshot: $SOURCE_DIR/$file"; exit 1; }
            python3 ../ci/validate-screenshot.py "$SOURCE_DIR/$file"
            cp "$SOURCE_DIR/$file" "$OUTPUT_DIR/$file"
            file "$OUTPUT_DIR/$file"
          done
      - name: Upload UI screenshots
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Radio.TV.Control-ui-screenshots-run-${{ github.run_number }}
          path: |
            Radio.TV.Control/ui-screenshots/remote.png
            Radio.TV.Control/ui-screenshots/digital-panel.png
            Radio.TV.Control/ui-screenshots/settings.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Radio.TV.Control-verification-run-${{ github.run_number }}
          path: |
            Radio.TV.Control/badging.txt
            Radio.TV.Control/manifest.xml
            Radio.TV.Control/sha256.txt
            Radio.TV.Control/size.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Radio.TV.Control-debug-run-${{ github.run_number }}
          path: Radio.TV.Control/artifact-out/Radio.TV.Control-debug.apk
          if-no-files-found: error
          retention-days: 30

